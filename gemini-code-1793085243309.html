<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹打磚塊 Arcade - Neon Breakout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #080811;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), 0 0 60px rgba(255, 0, 85, 0.2);
            border: 3px solid #00f3ff;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0e1b;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #14172c 0%, #080811 100%);
            cursor: none;
        }

        /* 遊戲 UI 覆蓋層 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 17, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #ff0055;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #ff0055;
            text-shadow: 0 0 8px #ff0055;
            margin-bottom: 25px;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 15px 25px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .stats-panel span {
            color: #00f3ff;
            font-weight: bold;
            text-shadow: 0 0 8px #00f3ff;
        }

        .btn {
            background: linear-gradient(45deg, #ff0055, #00f3ff);
            border: none;
            color: #fff;
            padding: 12px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8), 0 0 35px rgba(0, 243, 255, 0.8);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8a8ba5;
            text-align: center;
            line-height: 1.5;
        }

            font-size:
